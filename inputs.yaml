# Replace with your real company + 2 competitors to start (keeps free-tier usage low)
my_company:
  name: "Acme"
  domain: "acme.com"
  description: "SaaS project management tool for remote teams"

competitors:
  - name: "Notion"
    domain: "notion.so"
  - name: "Asana"
    domain: "asana.com"

time_window: "soft recency in query wording (no hard date filters per build-with-exa skill)"
max_results_per_query: 10 # server default; omitted from API call unless changed
max_queries_per_competitor: 4
fetch_proof: true # Exa get_contents for top campaign URLs
max_proof_urls: 5
max_age_days: 365 # campaigns older than this are excluded (0 = keep all)
synthesis: auto # auto (OpenAI if OPENAI_API_KEY), template ($0), or openai
